# XcodeGen project definition. Generate the Xcode project with:
#   ./scripts/bootstrap.sh      (or: xcodegen generate)
# CopyPal.xcodeproj is generated and never committed.
name: CopyPal

options:
  # Pinned so every XcodeGen version writes the same project format (Xcode 16.0+)
  # and Xcode does not ask to "update to recommended settings" after each bootstrap.
  projectFormat: xcode16_0
  xcodeVersion: "26.0"
  developmentLanguage: de
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  CopyPalKit:
    path: Packages/CopyPalKit
  # Updates outside the App Store (ROADMAP M9). Exact version, like CopyPalKit's
  # dependencies, because Package.resolved is not checked in.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  CopyPal:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: App
    dependencies:
      - package: CopyPalKit
        product: CopyPalCore
      - package: CopyPalKit
        product: CopyPalStorage
      - package: CopyPalKit
        product: CopyPalSystem
      - package: CopyPalKit
        product: CopyPalServices
      - package: Sparkle
      # Embedded in Contents/XPCServices.
      - target: CopyPalTextRecognition

  # Text recognition in its own process, which ends after the work: Vision's models
  # never stay in CopyPal's memory (ADR 0005, ROADMAP R32). Inherits signing, hardened
  # runtime and the Swift settings from the project's xcconfig files.
  CopyPalTextRecognition:
    type: xpc-service
    platform: macOS
    sources:
      - path: XPCServices/TextRecognition
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/TextRecognition-Info.plist
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CopyPal.dev.TextRecognition
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CopyPal.TextRecognition
    dependencies:
      - package: CopyPalKit
        product: CopyPalSystem

schemes:
  CopyPal:
    build:
      targets:
        CopyPal: all
    run:
      config: Debug
    archive:
      config: Release
