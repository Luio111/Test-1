name: CopyPal CI

# Runs only for changes to the app. The repository is private, so macOS minutes
# count 10x against the Actions quota: the cheap Linux job runs first and the macOS
# job only starts when it passes. Compiler warnings in CopyPal's own sources fail
# the build (Docs/ADR/0002).
on:
  pull_request:
    paths:
      - "CopyPal/**"
      - ".github/workflows/copypal-ci.yml"
  push:
    branches: [main]
    paths:
      - "CopyPal/**"
      - ".github/workflows/copypal-ci.yml"
  workflow_dispatch:

concurrency:
  group: copypal-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package-linux:
    name: Package tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install SQLite headers (GRDB)
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev > /dev/null
      # Ubuntu's SQLite is built without snapshots, which GRDB uses on Apple platforms.
      - name: Build and test CopyPalKit
        run: swift test --package-path CopyPal/Packages/CopyPalKit -Xswiftc -DSQLITE_DISABLE_SNAPSHOT 2>&1 | tee package.log
      - name: No warnings in own sources
        run: CopyPal/scripts/ci-check-warnings.sh package.log

  app-macos:
    name: App build + tests (macOS)
    needs: package-linux
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # Same major version as the main development Mac (ROADMAP R15).
      XCODE_VERSION: "26.0"
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          xcode="$(ls -d /Applications/Xcode_"${XCODE_VERSION}"*.app 2>/dev/null | head -n 1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode ${XCODE_VERSION} fehlt auf dem Runner. Vorhanden:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Package tests (incl. macOS adapters)
        run: swift test --package-path CopyPal/Packages/CopyPalKit 2>&1 | tee package.log
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        working-directory: CopyPal
        run: xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project CopyPal/CopyPal.xcodeproj \
            -scheme CopyPal \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee app.log
      - name: No warnings in own sources
        run: CopyPal/scripts/ci-check-warnings.sh package.log app.log
      # Runs the app's end-to-end check of the ⌘V gesture with simulated key presses.
      # GitHub's macOS runners grant Accessibility to processes started from job steps.
      - name: Self-test (capture, history, ⌘V gesture, popup)
        timeout-minutes: 4
        run: |
          app="build/DerivedData/Build/Products/Debug/CopyPal.app/Contents/MacOS/CopyPal"
          "$app" --self-test > selftest.log 2>&1 &
          pid=$!
          # macOS only lets an app take the focus cooperatively; on the runner nobody
          # hands it over, so bring the test app to the front via System Events
          # (allowed for job steps) until it reports that it is active.
          for _ in $(seq 1 30); do
            grep -q "CopyPal ist aktiv\|CopyPal wurde nicht aktiv\|Event-Tap nicht verfügbar" selftest.log && break
            # perl's alarm keeps a pending permission prompt from blocking the step.
            perl -e 'alarm 5; exec @ARGV' osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $pid) to true" >/dev/null 2>&1 || true
            sleep 0.5
          done
          set +e
          wait "$pid"
          status=$?
          set -e
          cat selftest.log
          if [ "$status" -eq 2 ]; then
            echo "::warning::Selbsttest nicht möglich: Event-Tap auf diesem Runner nicht verfügbar."
            exit 0
          fi
          exit "$status"
